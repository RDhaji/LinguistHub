<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LinguistHub Master</title>

  <!-- PWA & Mobile Meta -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="./icon.png">

  <!-- External Infrastructure: Firebase 8.x -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #334155;
      --star: #e2e8f0;
      --star-active: #eab308;
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --border: #e2e8f0;
      --star: #94a3b8;
      --star-active: #eab308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

    #sidebar { width: 320px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; transition: transform 0.2s ease; z-index: 20; }
    #sidebar.collapsed { transform: translateX(-100%); position: absolute; height: 100%; }
    #main-content { flex: 1; display: flex; flex-direction: column; position: relative; overflow-y: auto; }

    header { padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); }
    .btn { background: var(--accent); color: white; border: none; padding: 0.5rem 0.8rem; border-radius: 6px; cursor: pointer; font-weight: 500; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }

    .search-container { padding: 2rem 1rem 1rem 1rem; max-width: 680px; width: 100%; margin: 0 auto; }

    .input-wrapper { position: relative; display: flex; align-items: center; }
    #wordInput { width: 100%; padding: 0.85rem 2.8rem 0.85rem 1rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 1.1rem; outline: none; }
    #wordInput:focus { border-color: var(--accent); }
    #clearBtn { position: absolute; right: 0.8rem; background: none; border: none; color: var(--text-muted); cursor: pointer; display: none; font-size: 1.1rem; }

    #results { max-width: 680px; width: 100%; margin: 0 auto; padding: 1rem; display: none; }
    .word-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.5rem; }
    .word-title { font-size: 2rem; font-weight: 700; }
    .star-icon { cursor: pointer; font-size: 1.8rem; color: var(--star); transition: color 0.15s; }
    .star-icon.active { color: var(--star-active); }
    .meta-row { display: flex; gap: 0.75rem; margin-bottom: 1.25rem; font-size: 0.95rem; color: var(--text-muted); }
    .definition-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.25rem; line-height: 1.6; }

    .tab-bar { display: flex; border-bottom: 1px solid var(--border); }
    .tab { flex: 1; padding: 0.75rem; text-align: center; cursor: pointer; background: transparent; color: var(--text-muted); border: none; font-weight: 600; }
    .tab.active { color: var(--accent); border-bottom: 2px solid var(--accent); }
    #list-items { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.75rem; border-radius: 6px; cursor: pointer; }
    .list-item:hover { background: var(--border); }

    #loader { display: none; text-align: center; padding: 2rem; color: var(--text-muted); }
    #login-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.9); display: none; justify-content: center; align-items: center; z-index: 100; }
    .modal { background: var(--surface); padding: 2rem; border-radius: 12px; text-align: center; border: 1px solid var(--border); max-width: 380px; width: 90%; }
  </style>
</head>
<body data-theme="dark">

  <div id="login-overlay">
    <div class="modal">
      <h2 style="margin-bottom: 1rem;">LinguistHub Access</h2>
      <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Authenticate to sync personal history and lexical bookmarks.</p>
      <button class="btn" style="width: 100%;" onclick="login()">Continue with Google</button>
    </div>
  </div>

  <aside id="sidebar">
    <div style="padding: 1rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
      <strong>Lexical Workspace</strong>
      <button class="btn-secondary" style="padding: 0.2rem 0.5rem;" onclick="toggleSidebar()">✕</button>
    </div>
    <div class="tab-bar">
      <button id="tab-history" class="tab active" onclick="setTab('history')">History (<span id="history-count">0</span>)</button>
      <button id="tab-bookmarks" class="tab" onclick="setTab('bookmarks')">Pinned (<span id="pinned-count">0</span>)</button>
    </div>
    <div id="list-items"></div>
    <div style="padding: 0.75rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem;">
      <button class="btn-secondary" style="flex:1; font-size: 0.8rem;" onclick="exportData()">Export</button>
      <button class="btn-secondary" style="flex:1; font-size: 0.8rem; color: #ef4444;" onclick="clearCloud()">Purge</button>
    </div>
  </aside>

  <main id="main-content">
    <header>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn-secondary" onclick="toggleSidebar()">☰</button>
        <button class="btn-secondary" onclick="toggleTheme()">🌓</button>
      </div>
      <div style="font-weight: 600;">LinguistHub v2</div>
    </header>

    <div class="search-container">
      <div class="input-wrapper">
        <input 

            type="text" 
            id="wordInput" 
            placeholder="Lookup root, form, or affix..." 
            autocomplete="off" 
            autocapitalize="off" 
            spellcheck="false"
            oninput="toggleClearBtn(); prefetchPartition(event)" 
            onkeydown="if(event.key === 'Enter') handleSearch()"
        >
        <button id="clearBtn" onclick="clearSearchInput()">✕</button>
      </div>
    </div>

    <div id="loader">Fetching partition chunk...</div>

    <section id="results">
      <div class="word-header">
        <h1 id="r-word" class="word-title"></h1>
        <span id="mainStar" class="star-icon" onclick="toggleBookmark()">★</span>
      </div>
      <div class="meta-row">
        <span><strong>POS:</strong> <span id="r-pos"></span></span>
        <span>•</span>
        <span><strong>Syllables:</strong> <span id="r-syll"></span></span>
      </div>
      <div id="r-def" class="definition-box"></div>
    </section>
  </main>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .then(reg => console.log('[SW] Registered. Scope:', reg.scope))
          .catch(err => console.error('[SW] Registration failed:', err));
      });
    }

    const firebaseConfig = { 
      apiKey: "AIzaSyBGVL3ewn7589d9yX2qbbpde9DTVCWTyMc", 
      authDomain: "lingustichub.firebaseapp.com", 
      databaseURL: "https://lingustichub-default-rtdb.firebaseio.com/", 
      projectId: "lingustichub" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let history = [], bookmarks = [], lastWord = "", currentTab = 'history', userPath = "";

    function toggleSidebar() { document.getElementById('sidebar').classList.toggle('collapsed'); }
    function toggleTheme() { 
      const current = document.body.getAttribute('data-theme'); 
      document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark'); 
    }

    function toggleClearBtn() {
      const input = document.getElementById('wordInput');
      document.getElementById('clearBtn').style.display = input.value.length > 0 ? 'block' : 'none';
    }

    function clearSearchInput() {
      const input = document.getElementById('wordInput');
      input.value = "";
      toggleClearBtn();
      input.focus();
    }

    firebase.auth().onAuthStateChanged(user => {
      if (user) {
        document.getElementById('login-overlay').style.display = 'none';
        userPath = 'users/' + user.uid;
        db.ref(userPath + '/history').on('value', snap => {
          const data = snap.val() || {};
          history = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);
          updateSidebar();
        });
        db.ref(userPath + '/bookmarks').on('value', snap => {
          bookmarks = Object.keys(snap.val() || {});
          updateSidebar();
          updateStarUI();
        });
      } else {
        document.getElementById('login-overlay').style.display = 'flex';
      }
    });

    function login() {
      const provider = new firebase.auth.GoogleAuthProvider();
      firebase.auth().signInWithPopup(provider).catch(error => {
        console.error(error);
        alert("Authentication failed: " + error.message);
      });
    }

    async function handleSearch(searchWord) {
      const input = document.getElementById('wordInput');
      const word = (searchWord || input.value).trim().toLowerCase();
      if (!word) return;

      lastWord = word;
      input.value = word;
      document.getElementById('loader').style.display = 'block';
      document.getElementById('results').style.display = 'none';
      toggleClearBtn();
// Speculative Partition Prefetcher (0ms cache hits)
const prefetchedLetters = new Set();
function prefetchPartition(event) {
  const char = event.target.value.trim().charAt(0).toLowerCase();
  if (char && /^[a-z]$/.test(char) && !prefetchedLetters.has(char)) {
    prefetchedLetters.add(char);
    fetch(`./by-letter/structured_${char}.json`, { priority: 'low' })
      .catch(() => prefetchedLetters.delete(char));
  }
}
      try {
        const firstLetter = word.charAt(0);
        const response = await fetch(`./by-letter/structured_${firstLetter}.json`);
        
        if (!response.ok) throw new Error(`Partition chunk [${firstLetter}] unreadable.`);

        const partition = await response.json();
        const entry = partition[word];

        if (!entry) {
          alert(`"${word}" not found in local index.`);
          return;
        }

        document.getElementById('r-word').innerText = word;
        document.getElementById('r-pos').innerText = entry.pos || "N/A";
        document.getElementById('r-syll').innerText = entry.syllables ? entry.syllables.join('·') : word;
        document.getElementById('r-def').innerHTML = entry.definition || "No definition available.";
        document.getElementById('results').style.display = 'block';

        updateStarUI();

        if (userPath) {
          db.ref(userPath + '/history/' + word).set({ timestamp: Date.now() });
        }
      } catch (err) {
        console.error("[Search Engine Failure]:", err);
      } finally {
        document.getElementById('loader').style.display = 'none';
      }
    }

    function toggleBookmark() { 
      if (!lastWord || !userPath) return;
      if (bookmarks.includes(lastWord)) {
        db.ref(userPath + '/bookmarks/' + lastWord).remove();
      } else {
        db.ref(userPath + '/bookmarks/' + lastWord).set(true);
      }
    }

    function updateStarUI() { 
      const star = document.getElementById('mainStar'); 
      star.classList.toggle('active', bookmarks.includes(lastWord));
    }

    function updateSidebar() {
      const container = document.getElementById('list-items'); 
      container.innerHTML = "";
      const activeList = currentTab === 'history' ? history : bookmarks;
      
      activeList.forEach(itemWord => {
        const row = document.createElement('div'); 
        row.className = 'list-item';
        row.innerHTML = `
          <span style="flex:1" onclick="handleSearch('${itemWord}')">${itemWord}</span>
          <span style="color:var(--text-muted); cursor:pointer; padding: 0 4px;" onclick="event.stopPropagation(); db.ref('${userPath}/${currentTab}/${itemWord}').remove()">✕</span>
        `;
        container.appendChild(row);
      });

      document.getElementById('history-count').innerText = history.length;
      document.getElementById('pinned-count').innerText = bookmarks.length;
    }

    function setTab(tab) { 
      currentTab = tab; 
      document.getElementById('tab-history').classList.toggle('active', tab === 'history'); 
      document.getElementById('tab-bookmarks').classList.toggle('active', tab === 'bookmarks'); 
      updateSidebar(); 
    }

    function clearCloud() { 
      if (userPath && confirm("Permanently purge cloud history?")) {
        db.ref(userPath + '/' + currentTab).remove(); 
      }
    }

    function exportData() { 
      const payload = new Blob([JSON.stringify({ history, bookmarks }, null, 2)], { type: 'application/json' }); 
      const anchor = document.createElement('a'); 
      anchor.href = URL.createObjectURL(payload); 
      anchor.download = `LinguistHub_Backup_${Date.now()}.json`; 
      anchor.click(); 
    }
  </script>
</body>
</html>
